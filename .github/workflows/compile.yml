name: Compile check

# main 推送时检出私有构建输入（circle-refs）对两个游戏目标各做一次 DLL 编译验证
# （build.sh --dll-only，不含素材与 PCK——完整包属于 tag 触发的 Release 工作流）。
# 源码检查在 ci.yml；fork PR 无 secret，只跑源码检查。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 检出构建输入
        uses: actions/checkout@v4
        with:
          repository: SlayTheCircle/circle-refs
          token: ${{ secrets.REFS_TOKEN }}
          path: refs

      - name: 校验输入版本目录
        run: |
          for target in 0.111.0 0.107.1; do
            [[ -d "refs/game-refs/$target" ]] || { echo "错误: circle-refs 缺少 game-refs/$target。" >&2; exit 1; }
          done

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 双目标 DLL 编译
        env:
          RITSULIB_DIR: ${{ github.workspace }}/refs/RitsuLib
        run: |
          for target in 0.111.0 0.107.1; do
            echo "== 目标 $target =="
            GAME_REFS_DIR="$PWD/refs/game-refs/$target" RITSULIB_TARGET="$target" bash scripts/build.sh --dll-only
          done
