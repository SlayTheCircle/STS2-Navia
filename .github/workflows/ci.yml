name: Source checks

# 游戏引用、依赖包和多媒体不随仓库分发。编译与完整包另做本地验收。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Git 边界、文档、本地化与文本资源
        run: bash scripts/check.sh --source-only
