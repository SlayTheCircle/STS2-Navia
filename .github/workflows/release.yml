name: Release build

# tag 推送触发：检出私有构建输入（circle-refs 编译参考与美术母版仓）后在托管 runner
# 上完整构建，产出候选包并创建草稿 Release；维护者下载试玩验收后手动发布。
# 发行说明取自 CHANGELOG.md 的对应 `## [版本]` 段落，缺失即中止。
# fork PR 拿不到 secret，本工作流不会为其执行任何构建。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 校验 tag 并读取构建目标
        run: |
          if [[ "${GITHUB_REF_TYPE}" != tag ]]; then
            echo '错误: 本工作流只在 tag (v*) 上运行；分支请使用 ci.yml / compile.yml。' >&2
            exit 1
          fi
          target=$(python3 -c 'import json; print(json.load(open("STS2-Navia.json"))["min_game_version"])')
          version=$(python3 -c 'import json; print(json.load(open("STS2-Navia.json"))["version"])')
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" != "$version" ]]; then
            echo "错误: tag ${GITHUB_REF_NAME} 与清单版本 $version 不一致。" >&2
            exit 1
          fi
          echo "TARGET=$target" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: 检出构建输入
        uses: actions/checkout@v4
        with:
          repository: SlayTheCircle/circle-refs
          token: ${{ secrets.REFS_TOKEN }}
          path: refs

      - name: 检出美术母版
        uses: actions/checkout@v4
        with:
          repository: SlayTheCircle/STS2-Navia-art
          token: ${{ secrets.REFS_TOKEN }}
          path: art

      - name: 校验输入版本目录并记录来源
        run: |
          [[ -d "refs/game-refs/$TARGET" ]] || { echo "错误: circle-refs 缺少 game-refs/$TARGET。" >&2; exit 1; }
          echo "REFS_COMMIT=$(git -C refs rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "ART_COMMIT=$(git -C art rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 缓存 Godot
        uses: actions/cache@v4
        with:
          path: .tools/godot
          key: godot-4.5.1-linux-x86_64

      - name: 获取 Godot
        run: bash scripts/fetch-godot.sh

      - name: 生成派生素材
        env:
          ART_SOURCE_DIR: ${{ github.workspace }}/art
        run: |
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          bash scripts/prep-art.sh

      - name: 完整构建并打包
        env:
          NAVIA_PACKAGE_CHANNEL: release
          GAME_REFS_DIR: ${{ github.workspace }}/refs/game-refs/${{ env.TARGET }}
          RITSULIB_DIR: ${{ github.workspace }}/refs/RitsuLib
          RITSULIB_TARGET: ${{ env.TARGET }}
        run: bash scripts/package.sh

      - name: 组装发行说明
        run: |
          python3 - "$TAG" CHANGELOG.md /tmp/release-notes.md <<'PYCODE'
          import re
          import sys
          tag, src, dst = sys.argv[1:4]
          text = open(src, encoding='utf-8').read()
          match = re.search(rf'^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)', text, re.M | re.S)
          if not match:
              raise SystemExit(f'CHANGELOG 缺少 ## [{tag}] 段落。')
          body = match.group(1).strip()
          if not body:
              raise SystemExit(f'CHANGELOG 的 ## [{tag}] 段落为空。')
          open(dst, 'w', encoding='utf-8').write(body + '\n')
          PYCODE
          ritsu_min=$(python3 -c 'import json; print(json.load(open("STS2-Navia.json"))["dependencies"][0]["min_version"])')
          {
            echo
            echo '---'
            echo
            echo "**游戏目标**: $TARGET · **RitsuLib**: >= $ritsu_min"
            echo "**构建输入**: circle-refs@$REFS_COMMIT · 美术@$ART_COMMIT · 源码@${GITHUB_SHA::8}"
            echo
            echo '```'
            cat mods-dist/STS2-Navia-*.sha256
            echo '```'
          } >> /tmp/release-notes.md

      - name: 创建草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            mods-dist/STS2-Navia-*.zip \
            mods-dist/STS2-Navia-*.sha256 \
            --draft \
            --title "STS2-Navia v$TAG (game $TARGET)" \
            --notes-file /tmp/release-notes.md
          echo "草稿 Release 已创建；下载试玩验收通过后手动发布。"
